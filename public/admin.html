<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>签约数据管理后台</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
    body{background:#f5f7fa;padding:20px;}
    .container{max-width:1200px;margin:0 auto;}
    h1{text-align:center;margin:25px 0;color:#2c3e50;}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px;}
    .card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center;}
    .card h2{font-size:14px;color:#7f8c8d;margin-bottom:10px;}
    .card .num{font-size:32px;color:#2980b9;font-weight:bold;}
    .toolbar{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px;display:flex;gap:10px;flex-wrap:wrap;}
    input{padding:8px 12px;border:1px solid #ddd;border-radius:4px;flex:1;min-width:200px;}
    button{padding:8px 16px;background:#2980b9;color:#fff;border:none;border-radius:4px;cursor:pointer;}
    button:hover{background:#1f618d;}
    button.green{background:#27ae60;}
    table{width:100%;background:#fff;border-radius:8px;border-collapse:collapse;box-shadow:0 2px 8px rgba(0,0,0,.08);}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #eee;font-size:13px;}
    th{background:#f8f9fa;}
    .empty{text-align:center;padding:40px;color:#999;}
    .pagination{margin-top:15px;text-align:center;}
    .pagination button{margin:0 4px;}
    .pagination button.active{background:#1f618d;}
  </style>
</head>
<body>
<div class="container">
  <h1>📊 签约数据管理后台（永久保存版）</h1>
  <div class="stats">
    <div class="card"><h2>累计提交</h2><div class="num" id="total">0</div></div>
    <div class="card"><h2>今日提交</h2><div class="num" id="today">0</div></div>
    <div class="card"><h2>本月提交</h2><div class="num" id="month">0</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索：姓名 / 电话 / 邮箱">
    <button onclick="loadList(1)">🔍 搜索</button>
    <button class="green" onclick="exportExcel()">📥 导出Excel</button>
    <button onclick="loadAll()">🔄 刷新全部</button>
  </div>
  <table>
    <thead><tr><th>提交时间</th><th>客户姓名</th><th>联系电话</th><th>邮箱</th><th>签名状态</th></tr></thead>
    <tbody id="tableBody"><tr><td colspan="5" class="empty">加载中...</td></tr></tbody>
  </table>
  <div class="pagination" id="pagination"></div>
</div>
<script>
const API_BASE = '/api';
let currentPage=1;
window.onload=()=>{loadStats();loadList(1);};
async function loadStats(){
  try{const d=await(await fetch(`${API_BASE}/stats`)).json();
    document.getElementById('total').textContent=d.total;
    document.getElementById('today').textContent=d.today;
    document.getElementById('month').textContent=d.thisMonth;
  }catch(e){console.error(e);}
}
async function loadList(page=1){
  currentPage=page;
  const kw=document.getElementById('searchInput').value.trim();
  const u=new URL(`${API_BASE}/list`);
  u.searchParams.set('page',page);
  u.searchParams.set('pageSize',20);
  if(kw)u.searchParams.set('search',kw);
  try{const {total,list}=await(await fetch(u)).json();renderTable(list);renderPagination(total,page,20);}
  catch(e){document.getElementById('tableBody').innerHTML=`<tr><td colspan="5" class="empty">加载失败</td></tr>`;}
}
function loadAll(){document.getElementById('searchInput').value='';loadList(1);}
function renderTable(list){
  const tb=document.getElementById('tableBody');
  tb.innerHTML=list&&list.length?list.map(d=>`<tr><td>${d.createdAt?new Date(d.createdAt).toLocaleString('zh-CN'):'-'}</td><td>${e(d.customerName)}</td><td>${e(d.phone)}</td><td>${e(d.email)}</td><td>${d.typedSign||d.handSignImage?'✅ 已签名':'❌ 未签名'}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">暂无数据</td></tr>';
}
function renderPagination(total,page,size){
  const tp=Math.ceil(total/size),c=document.getElementById('pagination');
  c.innerHTML='';for(let i=1;i<=tp;i++){const b=Object.assign(document.createElement('button'),{textContent:i,className:i===page?'active':'',onclick:()=>loadList(i)});c.appendChild(b);}
}
function exportExcel(){window.open(`${API_BASE}/export`,'_blank');}
function e(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'-';}
</script>
</body>
</html>
